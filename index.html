<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" id="pageDescription" content="フィッシングや詐欺メッセージの感情的トリガーワードを検出する無料ツール">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Emotion-Based Scam Detector - メッセージの感情トリガー検出ツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="lang-bar">
      <button id="langToggle" type="button" class="lang-toggle" data-i18n="lang.toggle" data-i18n-label="lang.toggleLabel"></button>
    </div>
    <h1>Emotion-Based Scam Detector</h1>
    <p>
      <span data-i18n="header.lead1"></span><br>
      <span data-i18n="header.lead2"></span>
    </p>
  </header>

  <noscript>
    <p class="notice notice-error">このツールはJavaScriptで動きます。ブラウザーのJavaScriptを有効にしてください。<br>
      This tool runs on JavaScript. Please enable JavaScript in your browser.</p>
  </noscript>

  <div id="legend">
    <p><span class="highlight emergency" data-i18n="category.emergency.label"></span> – <span data-i18n="category.emergency.hint"></span></p>
    <p><span class="highlight fear" data-i18n="category.fear.label"></span> – <span data-i18n="category.fear.hint"></span></p>
    <p><span class="highlight greed" data-i18n="category.greed.label"></span> – <span data-i18n="category.greed.hint"></span></p>
  </div>

  <div id="presets">
    <label class="presets-label" for="presetSelect" data-i18n="presets.label"></label>
    <select id="presetSelect" class="preset-select">
      <option value="" data-i18n="presets.placeholder"></option>
      <optgroup data-i18n-optgroup="presets.group.scamJa">
        <option value="phishing_jp" data-i18n="sample.phishing_jp.label"></option>
        <option value="delivery_jp" data-i18n="sample.delivery_jp.label"></option>
        <option value="support_jp" data-i18n="sample.support_jp.label"></option>
        <option value="tax_jp" data-i18n="sample.tax_jp.label"></option>
        <option value="investment_jp" data-i18n="sample.investment_jp.label"></option>
        <option value="lottery_jp" data-i18n="sample.lottery_jp.label"></option>
        <option value="job_jp" data-i18n="sample.job_jp.label"></option>
        <option value="romance_jp" data-i18n="sample.romance_jp.label"></option>
      </optgroup>
      <optgroup data-i18n-optgroup="presets.group.scamEn">
        <option value="phishing_en" data-i18n="sample.phishing_en.label"></option>
      </optgroup>
      <optgroup data-i18n-optgroup="presets.group.legit">
        <option value="legit_delivery_jp" data-i18n="sample.legit_delivery_jp.label"></option>
        <option value="legit_bank_jp" data-i18n="sample.legit_bank_jp.label"></option>
        <option value="legit_work_jp" data-i18n="sample.legit_work_jp.label"></option>
        <option value="legit_campaign_jp" data-i18n="sample.legit_campaign_jp.label"></option>
        <option value="legit_signin_en" data-i18n="sample.legit_signin_en.label"></option>
      </optgroup>
    </select>
  </div>

  <p id="dictionaryNotice" class="notice" role="status" hidden></p>

  <label class="input-label" for="inputText" data-i18n="input.label"></label>
  <textarea id="inputText" data-i18n-placeholder="input.placeholder"></textarea>
  <div class="button-group">
    <button id="analyzeBtn" type="button" data-i18n="button.analyze"></button>
    <button id="clearBtn" type="button" class="secondary" data-i18n="button.clear"></button>
  </div>

  <div id="result" hidden>
    <h2 data-i18n="result.heading"></h2>

    <p id="sampleNotice" class="notice notice-legit" role="status" hidden></p>

    <div class="result-container">
      <div class="result-left">
        <div class="risk-summary">
          <div class="risk-score-display">
            <div class="score-label" data-i18n="result.total"></div>
            <div class="score-value" id="totalScore">0</div>
            <div class="score-max" data-i18n="result.max"></div>
          </div>
          <div class="risk-assessment" id="riskAssessment" aria-live="polite">
            <div class="assessment-badge" id="riskBadge"></div>
            <div class="assessment-text" id="assessmentText"></div>
          </div>
        </div>

        <div class="category-scores">
          <div class="category-score">
            <span class="category-name" id="emergencyName" data-i18n="category.emergency.label"></span>
            <div class="score-bar" aria-hidden="true">
              <div class="score-fill emergency-fill" id="emergencyBar"></div>
            </div>
            <span class="score-number" id="emergencyScore">0</span>
            <span class="score-detail" id="emergencyDetail"></span>
          </div>
          <div class="category-score">
            <span class="category-name" id="fearName" data-i18n="category.fear.label"></span>
            <div class="score-bar" aria-hidden="true">
              <div class="score-fill fear-fill" id="fearBar"></div>
            </div>
            <span class="score-number" id="fearScore">0</span>
            <span class="score-detail" id="fearDetail"></span>
          </div>
          <div class="category-score">
            <span class="category-name" id="greedName" data-i18n="category.greed.label"></span>
            <div class="score-bar" aria-hidden="true">
              <div class="score-fill greed-fill" id="greedBar"></div>
            </div>
            <span class="score-number" id="greedScore">0</span>
            <span class="score-detail" id="greedDetail"></span>
          </div>
        </div>
      </div>

      <div class="result-right">
        <div class="chart-container">
          <svg id="radarChart" class="radar" viewBox="0 0 300 230" role="img"></svg>
          <ul class="radar-legend">
            <li><span class="legend-swatch legend-threshold" aria-hidden="true"></span><span data-i18n="radar.threshold"></span></li>
            <li><span class="legend-swatch legend-detected" aria-hidden="true"></span><span data-i18n="radar.detected"></span></li>
          </ul>
        </div>
      </div>
    </div>

    <h3 class="output-heading" data-i18n="output.heading"></h3>
    <div id="highlightedText" class="text-output"></div>

    <div class="safety-tips">
      <button class="accordion-header" id="safetyTipsToggle" type="button" aria-expanded="false" aria-controls="safetyTipsContent">
        <span data-i18n="tips.heading"></span>
        <span class="accordion-icon" aria-hidden="true">▼</span>
      </button>
      <div class="accordion-content" id="safetyTipsContent">
        <div class="tips-grid">
          <div class="tip-card">
            <div class="tip-icon" aria-hidden="true">🚫</div>
            <div class="tip-title" data-i18n="tips.link.title"></div>
            <div class="tip-desc" data-i18n="tips.link.desc"></div>
          </div>
          <div class="tip-card">
            <div class="tip-icon" aria-hidden="true">🔍</div>
            <div class="tip-title" data-i18n="tips.official.title"></div>
            <div class="tip-desc" data-i18n="tips.official.desc"></div>
          </div>
          <div class="tip-card">
            <div class="tip-icon" aria-hidden="true">🌐</div>
            <div class="tip-title" data-i18n="tips.login.title"></div>
            <div class="tip-desc" data-i18n="tips.login.desc"></div>
          </div>
          <div class="tip-card">
            <div class="tip-icon" aria-hidden="true">📞</div>
            <div class="tip-title" data-i18n="tips.contact.title"></div>
            <div class="tip-desc" data-i18n="tips.contact.desc"></div>
          </div>
          <div class="tip-card">
            <div class="tip-icon" aria-hidden="true">🔒</div>
            <div class="tip-title" data-i18n="tips.secret.title"></div>
            <div class="tip-desc" data-i18n="tips.secret.desc"></div>
          </div>
          <div class="tip-card">
            <div class="tip-icon" aria-hidden="true">⏰</div>
            <div class="tip-title" data-i18n="tips.calm.title"></div>
            <div class="tip-desc" data-i18n="tips.calm.desc"></div>
          </div>
          <div class="tip-card">
            <div class="tip-icon" aria-hidden="true">🐦</div>
            <div class="tip-title" data-i18n="tips.search.title"></div>
            <div class="tip-desc" data-i18n="tips.search.desc"></div>
          </div>
          <div class="tip-card">
            <div class="tip-icon" aria-hidden="true">👥</div>
            <div class="tip-title" data-i18n="tips.ask.title"></div>
            <div class="tip-desc" data-i18n="tips.ask.desc"></div>
          </div>
        </div>
      </div>
    </div>

    <p class="limits" data-i18n="limits"></p>
  </div>

  <footer>
    <div class="footer">
      🔗 <a href="https://github.com/ipusiron/emotion-based-scam-detector" target="_blank" rel="noopener noreferrer" data-i18n="footer.text"></a>
    </div>
  </footer>

  <script src="js/dictionary.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/scam-core.js"></script>
  <script src="js/radar.js"></script>
  <script src="script.js"></script>
</body>
</html>
